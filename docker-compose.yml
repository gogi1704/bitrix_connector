services:
  connector:
    build: .
    env_file: .env
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "127.0.0.1:${CONNECTOR_HOST_PORT:-8001}:8000"
    volumes:
      - ./storage:/app/storage
      - ${ANKETA_BOT_MAX_DOCS_DIR:-../anketa_bot_max/docs}:/external/anketa_bot_max/docs:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped
    networks:
      connector_internal:
      consilium_internal:
        aliases:
          - bitrix_connector

networks:
  connector_internal:
    name: bitrix-max-connector-internal
  consilium_internal:
    external: true
    name: consilium-internal
